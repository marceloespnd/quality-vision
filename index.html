<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quality Vision</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563EB" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: {
              soft: '0 18px 55px rgba(0,0,0,0.32)',
            },
          },
        },
      }
    </script>
      <style>
        :root {
          --bg: #F3F4F6;
          --sidebar: #FFFFFF;
          --surface: #FFFFFF;
          --surface-muted: #E8EAED;
          --modal: #FFFFFF;
          --hover: #E5E7EB;
          --logo-bg: #08090B;
          --logo-hover: #111827;
          --logo-blend: normal;
          --border: #D1D5DB;
          --text: #16181D;
          --muted: #626874;
          --accent: #2563EB;
          --accent-hover: #1D4ED8;
          --accent-text: #FFFFFF;
          --accent-muted: #DBEAFE;
          --blue: #2563EB;
          --blue-soft: #DBEAFE;
          --green: #10B981;
          --green-soft: #D1FAE5;
          --red: #EF4444;
          --red-soft: #FEE2E2;
          --orange: #F97316;
          --orange-soft: #FFEDD5;
          --purple: #8B5CF6;
          --purple-soft: #EDE9FE;
          --gray: #6B7280;
          --gray-soft: #E5E7EB;
          color-scheme: light;
        }
        :root[data-theme='dark'] {
          --bg: #0F172A;
          --sidebar: #111827;
          --surface: #1E293B;
          --surface-muted: #273449;
          --modal: #273449;
          --hover: #334155;
          --logo-bg: #111827;
          --logo-hover: #334155;
          --logo-blend: screen;
          --border: #334155;
          --text: #F8FAFC;
          --muted: #CBD5E1;
          --accent: #3B82F6;
          --accent-hover: #60A5FA;
          --accent-text: #FFFFFF;
          --accent-muted: #1E3A8A;
          --blue: #3B82F6;
          --blue-soft: rgba(59,130,246,0.16);
          --green: #34D399;
          --green-soft: rgba(52,211,153,0.14);
          --red: #F87171;
          --red-soft: rgba(248,113,113,0.14);
          --orange: #FB923C;
          --orange-soft: rgba(251,146,60,0.16);
          --purple: #A78BFA;
          --purple-soft: rgba(167,139,250,0.16);
          --gray: #9CA3AF;
          --gray-soft: rgba(156,163,175,0.16);
          color-scheme: dark;
        }
        .quality-vision-logo { mix-blend-mode: var(--logo-blend); }
        html, body, #root { min-height: 100%; background: var(--bg); }
        html, body { transition: background-color .2s ease, color .2s ease; }
      </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
